<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BRAWL · a Kindling example</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0d12;
        cursor: default;
      }
      #game {
        position: fixed;
        inset: 0;
      }
      #game canvas {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      .err {
        position: fixed;
        inset: 1em;
        color: #f88;
        font: 12px monospace;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
